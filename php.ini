[php]
upload_max_filesize = 512M
post_max_size = 512M
; WordPress recommends 256M; processing large uploaded images needs it
memory_limit = 256M
; PHP's default of 1000 silently drops form fields beyond that: saving a large
; menu (~80+ items), WooCommerce variations or page builder settings loses data
max_input_vars = 5000
; Runtime settings for new and existing sites (HTTPS behind proxies,
; DISALLOW_FILE_EDIT, DISABLE_WP_CRON); see frankenpress-prepend.php. If you
; set your own auto_prepend_file, include this file from it.
auto_prepend_file = /usr/local/share/frankenpress/prepend.php
