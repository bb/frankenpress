# FrankenPress with MariaDB and Redis.
#
#   cp .env.example .env    # then set SERVER_NAME and the passwords
#   docker compose up -d
#   docker compose --profile tools up -d phpmyadmin   # optional, see below
#
# For production, pin a dated FrankenPress tag (e.g.
# php-8.5-trixie-wp7.1.2-20261004-0112) instead of :latest, and update it
# deliberately. MariaDB instead follows its current LTS release, with the
# data directory upgraded automatically (see the db service).
name: frankenpress

services:
  wordpress:
    image: bock/frankenpress:latest
    restart: unless-stopped
    # Limits for a typical site (low to moderate traffic, ~50-100 MB per
    # request). Set CPU, memory and PHP threads together; see "Resource
    # Limits" in the README before changing one of them.
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1G
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      # Theme and plugin code editors in wp-admin: off unless set to 0
      DISALLOW_FILE_EDIT: ${DISALLOW_FILE_EDIT:-}
      # 1: serve WP Super Cache's pages without PHP (see "Page Cache")
      SUPERCACHE: ${SUPERCACHE:-}
      # PHP threads: start with 4, add more under load, up to 8. Without
      # this, the image starts two per available CPU, at most 4: only 2
      # with "cpus: 1", and none added under load.
      FRANKENPHP_CONFIG: |
        num_threads 4
        max_threads 8
      # Outgoing mail (password resets, notifications); see "Sending Email"
      # in the README. Without MSMTP_HOST, WordPress can't send email.
      MSMTP_HOST: ${MSMTP_HOST:-}
      MSMTP_PORT: ${MSMTP_PORT:-587}
      MSMTP_USER: ${MSMTP_USER:-}
      MSMTP_PASSWORD: ${MSMTP_PASSWORD:-}
      MSMTP_FROM: ${MSMTP_FROM:-}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Settings for the "Redis Object Cache" plugin (redis-cache); install and
      # enable it with: docker compose exec wordpress wp plugin install redis-cache --activate
      #                 docker compose exec wordpress wp redis enable
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
    volumes:
      - wordpress:/var/www/html
      # Keep certificates across container recreation; without this, every
      # recreate requests new certificates and can hit Let's Encrypt rate limits.
      - caddy-data:/data/caddy
      - caddy-config:/config/caddy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mariadb:lts
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      # Upgrade the data directory (after backing up the system tables) when
      # the image moves to a new major version. Without it, e.g.
      # mariadb-dump --routines fails with "Column count of mysql.proc is
      # wrong". Remove or comment out this line to upgrade manually.
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Object cache only: no persistence, oldest keys evicted when full
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional database UI, only reachable from the host itself. From another
  # machine, use an SSH tunnel: ssh -L 8080:127.0.0.1:8080 <server>
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  wordpress:
  db:
  caddy-data:
  caddy-config:
