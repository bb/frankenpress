name: Update Docker Hub Description

# Keeps the Docker Hub page in sync with README.md.
#
# Docker Hub only lets tokens with the "Read, Write, Delete" scope change a
# repository's description. To keep that scope away from the publishing
# workflow, store such a token as DOCKERHUB_DESCRIPTION_TOKEN; without it this
# falls back to DOCKERHUB_TOKEN, which only works if that token has the scope.

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/workflows/dockerhub-description.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: bock/frankenpress

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: WordPress on FrankenPHP & Caddy, hardened for production. PHP 8.5, Debian Trixie.
          readme-filepath: ./README.md
