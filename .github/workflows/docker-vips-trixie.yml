name: Build Docker VIPS Images (Trixie)

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.vips-ffi'
      - 'Dockerfile'
      - 'Caddyfile'
      - 'php.ini'
      - '.github/workflows/docker-vips-trixie.yml'
  pull_request:
    paths:
      - 'Dockerfile.vips-ffi'
      - 'Dockerfile'
      - 'Caddyfile'
      - 'php.ini'
      - '.github/workflows/docker-vips-trixie.yml'
  schedule:
    - cron: "0 7 * * 0" # Every Sunday at 7 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: bock/frankenpress

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Only build PHP 8.4 and 8.5 for PRs to speed up CI, build all versions for main branch
        php-version: ${{ github.event_name == 'pull_request' && fromJSON('[8.4, 8.5]') || fromJSON('[8.2, 8.3, 8.4, 8.5]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          labels: |
            org.opencontainers.image.title=FrankenPress VIPS/FFI (PHP ${{ matrix.php-version }} Trixie)
            org.opencontainers.image.description=WordPress with VIPS and FFI running on FrankenPHP with Debian Trixie
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker SBOM
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: ./Dockerfile.vips-ffi
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:php-${{ matrix.php-version }}-vips-ffi-trixie
            ghcr.io/${{ github.repository_owner }}/frankenpress:php-${{ matrix.php-version }}-vips-ffi-trixie
            ${{ matrix.php-version == '8.4' && format('{0}:vips-ffi-trixie', env.DOCKERHUB_IMAGE) || '' }}
            ${{ matrix.php-version == '8.4' && format('{0}:vips-ffi', env.DOCKERHUB_IMAGE) || '' }}
            ${{ matrix.php-version == '8.4' && format('ghcr.io/{0}/frankenpress:vips-ffi-trixie', github.repository_owner) || '' }}
            ${{ matrix.php-version == '8.4' && format('ghcr.io/{0}/frankenpress:vips-ffi', github.repository_owner) || '' }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:php-${{ matrix.php-version }}-vips-ffi-trixie
          cache-to: type=gha,mode=max
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            DEBIAN_VERSION=trixie
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/frankenpress
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ${{ env.DOCKERHUB_IMAGE }}:php-${{ matrix.php-version }}-vips-ffi-trixie php -v | grep "PHP ${{ matrix.php-version }}"
          docker run --rm ${{ env.DOCKERHUB_IMAGE }}:php-${{ matrix.php-version }}-vips-ffi-trixie php -m | grep FFI
          docker run --rm ${{ env.DOCKERHUB_IMAGE }}:php-${{ matrix.php-version }}-vips-ffi-trixie frankenphp version
          docker run --rm ${{ env.DOCKERHUB_IMAGE }}:php-${{ matrix.php-version }}-vips-ffi-trixie wp --version
          docker run --rm ${{ env.DOCKERHUB_IMAGE }}:php-${{ matrix.php-version }}-vips-ffi-trixie ls -la /usr/src/wordpress | grep wp-config-docker.php
          docker run --rm ${{ env.DOCKERHUB_IMAGE }}:php-${{ matrix.php-version }}-vips-ffi-trixie dpkg -l | grep libvips
