name: Build Docker Images (Trixie)

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - 'php.ini'
      - 'imagemagick-policy.xml'
      - 'frankenpress-entrypoint.sh'
      - 'frankenpress-prepend.php'
      - 'frankenpress-sendmail.sh'
      - 'wp-cli.yml'
      - 'tests/**'
      - '.github/workflows/docker-trixie.yml'
  # Every pull request builds and tests, without a paths filter: main
  # requires these checks, and a PR that never reports them (e.g. one that
  # only touches the README) could never be merged. Pushes to main keep the
  # filter, so documentation changes don't republish images.
  pull_request:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 1 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: bock/frankenpress
  # PHP version that receives the unversioned tags (latest, trixie, vips-ffi, ...).
  # Keep in sync with the php-version lists below and the php-build base image
  # tag in the Dockerfile (the PHP version is chosen there, not via build-args).
  LATEST_PHP: '8.5'

jobs:
  build:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        php-version: ['8.5']
        # Dockerfile targets; the tag suffix is derived from the variant name
        variant: [standard, vips-ffi]
        # Split platforms to use native runners (amd64 on x64, arm64 on ARM); PRs build amd64 only
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["linux/amd64"]') || fromJSON('["linux/amd64", "linux/arm64"]') }}
      fail-fast: false
    # Job-level permissions replace the workflow's, so repeat those and add
    # security-events for uploading Trivy results to code scanning
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # e.g. php-8.5-trixie-amd64 or php-8.5-vips-ffi-trixie-arm64
      ARCH_TAG: php-${{ matrix.php-version }}${{ matrix.variant != 'standard' && format('-{0}', matrix.variant) || '' }}-trixie-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      CACHE_SCOPE: ${{ matrix.platform }}-${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PR builds only pull public images and never push, so they skip the
      # logins; secrets aren't available to PRs from forks anyway.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/frankenpress
          tags: |
            type=raw,value=${{ env.ARCH_TAG }}
          labels: |
            org.opencontainers.image.title=FrankenPress${{ matrix.variant == 'vips-ffi' && ' VIPS/FFI' || '' }} (PHP ${{ matrix.php-version }} Trixie)
            org.opencontainers.image.description=WordPress${{ matrix.variant == 'vips-ffi' && ' with VIPS and FFI' || '' }} running on FrankenPHP with Debian Trixie
            org.opencontainers.image.licenses=MIT
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: .
          target: ${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Each variant writes its own cache scope; vips-ffi also reads the standard
          # scope so the shared base layers are reused.
          cache-from: |
            type=gha,scope=${{ env.CACHE_SCOPE }}-standard
            type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.variant }}
            type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}-${{ matrix.variant }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}
        run: |
          set -euo pipefail
          run() { docker run --rm "$IMAGE" "$@"; }

          # Startup must be clean: a broken extension loader only shows up as a warning
          out=$(run php -v 2>&1)
          echo "$out"
          grep -q "PHP ${{ matrix.php-version }}" <<<"$out"
          if grep -qiE 'warning|unable to load' <<<"$out"; then
            echo "::error::PHP startup produced warnings"; exit 1
          fi

          run php -m | grep -qx 'Zend OPcache'
          run frankenphp version
          run wp --version
          run ls -la /usr/src/wordpress | grep wp-config-docker.php

          if [ "${{ matrix.variant }}" = vips-ffi ]; then
            run php -m | grep -qx FFI
            run dpkg -l | grep libvips
            run ls /usr/src/wordpress/wp-content/plugins | grep vips-image-editor-ffi
            run printenv VIPS_BLOCK_UNTRUSTED | grep -qx 1
          fi

      # Full run against WordPress + MariaDB: hardening rules, proxy handling,
      # healthcheck and image processing (see tests/integration.sh)
      - name: Integration test
        if: github.event_name == 'pull_request'
        run: tests/integration.sh "${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}" "${{ matrix.variant }}"

      # Report-only: lists HIGH/CRITICAL vulnerabilities in the job summary and
      # never fails the build. Trivy runs from its official image pinned by
      # digest rather than via aquasecurity/trivy-action, whose tags were
      # hijacked in 2026 (CVE-2026-33634).
      - name: Vulnerability scan (Trivy)
        if: matrix.platform == 'linux/amd64'
        continue-on-error: true
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}
          TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --format json --output /out/trivy.json "$IMAGE"
          docker run --rm -v "$PWD:/out" "$TRIVY" \
            convert --quiet --format sarif --output /out/trivy.sarif /out/trivy.json
          summary=$(jq -r '[.Results[]?.Vulnerabilities[]?] as $v
            | "critical=\($v | map(select(.Severity == "CRITICAL")) | length)"
            + " high=\($v | map(select(.Severity == "HIGH")) | length)"
            + " fixable=\($v | map(select((.FixedVersion // "") != "")) | length)"' trivy.json)
          echo "::notice title=Trivy ($ARCH_TAG)::$summary"
          {
            echo "### Trivy: \`$IMAGE\`"
            echo "$summary"
            echo
            echo "| Severity | Vulnerability | Package | Installed | Fixed in |"
            echo "|---|---|---|---|---|"
            jq -r '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + .PkgName)
              | sort_by(if .Severity == "CRITICAL" then 0 else 1 end, .PkgName)[]
              | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "") |"' trivy.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Track the same findings in the repository's Security tab (code
      # scanning), one category per variant. Report-only like the scan; PRs
      # from forks can't upload, so failures don't fail the build.
      - name: Upload Trivy results to code scanning
        if: matrix.platform == 'linux/amd64'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.variant }}

  create-manifests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        php-version: ['8.5']
        variant: [standard, vips-ffi]
    env:
      # Tag suffix shared by both registries, e.g. "trixie" or "vips-ffi-trixie"
      SUFFIX: ${{ matrix.variant != 'standard' && format('{0}-', matrix.variant) || '' }}trixie
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Besides the floating tags, publish version-specific ones so deployments
      # can pin a build and roll back, e.g. php-8.5-trixie-wp7.1.2 (follows
      # rebuilds of that WordPress version) and php-8.5-trixie-wp7.1.2-20261004
      # (one specific weekly build).
      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          tag="php-${{ matrix.php-version }}-$SUFFIX"
          wp=$(docker run --rm --entrypoint php "${{ env.DOCKERHUB_IMAGE }}:$tag-amd64" \
            -r 'include "/usr/src/wordpress/wp-includes/version.php"; echo $wp_version;')
          [[ "$wp" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Unexpected WordPress version '$wp'"; exit 1; }
          build_date=$(date -u +%Y%m%d)
          echo "::notice title=Tags ($tag)::WordPress $wp, build $build_date"
          for repo in "${{ env.DOCKERHUB_IMAGE }}" "ghcr.io/${{ github.repository_owner }}/frankenpress"; do
            tags=(-t "$repo:$tag" -t "$repo:$tag-wp$wp" -t "$repo:$tag-wp$wp-$build_date")
            if [ "${{ matrix.php-version }}" = "$LATEST_PHP" ]; then
              # standard: trixie + latest; vips-ffi: vips-ffi-trixie + vips-ffi
              tags+=(-t "$repo:$SUFFIX" -t "$repo:${{ matrix.variant == 'standard' && 'latest' || matrix.variant }}")
            fi
            docker buildx imagetools create "${tags[@]}" "$repo:$tag-amd64" "$repo:$tag-arm64"
            docker buildx imagetools inspect "$repo:$tag"
          done

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, which silently stops the weekly rebuilds that pick up PHP and
  # base image fixes (this is what froze notglossy/frankenpress-src).
  # Re-enabling the workflow through the API resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/docker-trixie.yml/enable"
