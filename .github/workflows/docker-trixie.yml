name: Build Docker Images (Trixie)

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - 'php.ini'
      - 'imagemagick-policy.xml'
      - 'frankenpress-entrypoint.sh'
      - 'frankenpress-prepend.php'
      - 'frankenpress-sendmail.sh'
      - 'frankenpress-bundled.sh'
      - 'frankenpress-mariadb.sh'
      - 'frankenpress-cron.sh'
      - 'frankenpress-cron.php'
      - 'wp-cli.yml'
      - 'weasyprint/requirements.txt'
      - '.dockerignore'
      - 'tests/**'
      - '.github/workflows/docker-trixie.yml'
  # Every pull request builds and tests, without a paths filter: main
  # requires these checks, and a PR that never reports them (e.g. one that
  # only touches the README) could never be merged. Pushes to main keep the
  # filter, so documentation changes don't republish images.
  pull_request:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 1 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: bock/frankenpress
  # PHP version that receives the unversioned tags (latest, trixie, vips-ffi, ...).
  # Keep in sync with the php-version lists below and the php-build base image
  # tag in the Dockerfile (the PHP version is chosen there, not via build-args).
  LATEST_PHP: '8.5'

jobs:
  build:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        php-version: ['8.5']
        # Dockerfile targets; the tag suffix is derived from the variant name
        variant: [standard, vips-ffi, weasyprint]
        # Split platforms to use native runners (amd64 on x64, arm64 on ARM); PRs build amd64 only
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["linux/amd64"]') || fromJSON('["linux/amd64", "linux/arm64"]') }}
      fail-fast: false
    # Job-level permissions replace the workflow's, so repeat those and add
    # security-events for uploading Trivy results to code scanning
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # e.g. php-8.5-trixie-amd64 or php-8.5-vips-ffi-trixie-arm64
      ARCH_TAG: php-${{ matrix.php-version }}${{ matrix.variant != 'standard' && format('-{0}', matrix.variant) || '' }}-trixie-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      CACHE_SCOPE: ${{ matrix.platform }}-${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PR builds only pull public images and never push, so they skip the
      # logins; secrets aren't available to PRs from forks anyway.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/frankenpress
          tags: |
            type=raw,value=${{ env.ARCH_TAG }}
          labels: |
            org.opencontainers.image.title=FrankenPress${{ matrix.variant == 'vips-ffi' && ' VIPS/FFI' || matrix.variant == 'weasyprint' && ' WeasyPrint' || '' }} (PHP ${{ matrix.php-version }} Trixie)
            org.opencontainers.image.description=WordPress${{ matrix.variant == 'vips-ffi' && ' with VIPS and FFI' || matrix.variant == 'weasyprint' && ' with WeasyPrint for PDFs' || '' }} running on FrankenPHP with Debian Trixie
            org.opencontainers.image.licenses=MIT
          flavor: |
            latest=false

      # Every run builds into the local Docker daemon first and tests that
      # image; the push further down only happens once the tests pass, so
      # scheduled rebuilds (new Debian packages) are tested like PRs.
      # Attestations need a registry push, so this build has none.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: .
          target: ${{ matrix.variant }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          # Each variant writes its own cache scope; the variants also read the standard
          # scope so the shared base layers are reused.
          cache-from: |
            type=gha,scope=${{ env.CACHE_SCOPE }}-standard
            type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.variant }}
            type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}-${{ matrix.variant }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Smoke test
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}
        run: |
          set -euo pipefail
          run() { docker run --rm "$IMAGE" "$@"; }

          # Startup must be clean: a broken extension loader only shows up as a warning
          out=$(run php -v 2>&1)
          echo "$out"
          grep -q "PHP ${{ matrix.php-version }}" <<<"$out"
          if grep -qiE 'warning|unable to load' <<<"$out"; then
            echo "::error::PHP startup produced warnings"; exit 1
          fi

          # Output is captured before matching: piping into "grep -q" lets grep
          # exit at the first match, and the writer's SIGPIPE then fails the
          # step under pipefail.
          modules=$(run php -m)
          grep -qx 'Zend OPcache' <<<"$modules"

          # Every extension from the Dockerfile's install-php-extensions list:
          # a dropped entry still starts cleanly, so the warning check misses it
          for ext in bcmath exif gd intl mysqli pdo_mysql zip imagick memcached apcu redis igbinary msgpack; do
            grep -qx "$ext" <<<"$modules" || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done

          # FFI is installed everywhere but only enabled in the vips-ffi image
          if [ "${{ matrix.variant }}" != vips-ffi ] && grep -qx FFI <<<"$modules"; then
            echo "::error::FFI is enabled outside the vips-ffi image"; exit 1
          fi

          # Security floor: PHP2Shell (CVE-2026-109618/109619) and the
          # FrankenPHP advisories fixed in 1.13.2. Fails closed when a version
          # can't be parsed. Raise these after the next security release.
          at_least() { [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          fp=$(run frankenphp version)
          echo "$fp"
          fp_version=$(sed -nE 's/^FrankenPHP v([0-9.]+) .*/\1/p' <<<"$fp")
          php_version=$(run php -r 'echo PHP_VERSION;')
          at_least "$fp_version" 1.13.2 || { echo "::error::FrankenPHP '$fp_version' is older than 1.13.2"; exit 1; }
          at_least "$php_version" 8.5.12 || { echo "::error::PHP '$php_version' is older than 8.5.12"; exit 1; }

          run wp --version
          grep -qx wp-config-docker.php <<<"$(run ls /usr/src/wordpress)"

          if [ "${{ matrix.variant }}" = vips-ffi ]; then
            grep -qx FFI <<<"$modules"
            grep -q libvips <<<"$(run dpkg -l)"
            grep -qx vips-image-editor-ffi <<<"$(run ls /usr/src/wordpress/wp-content/plugins)"
            grep -qx 1 <<<"$(run printenv VIPS_BLOCK_UNTRUSTED)"
          fi

          # Security floor for WeasyPrint, as above: 70.0 fixes the CVEs of
          # Debian's 62.3 (see the Dockerfile)
          if [ "${{ matrix.variant }}" = weasyprint ]; then
            weasy_version=$(run weasyprint --version | sed -nE 's/^WeasyPrint version ([0-9.]+)$/\1/p')
            at_least "$weasy_version" 70.0 || { echo "::error::WeasyPrint '$weasy_version' is older than 70.0"; exit 1; }
          fi

      # Full run against WordPress + MariaDB: hardening rules, proxy handling,
      # healthcheck and image processing (see tests/integration.sh)
      - name: Integration test
        run: tests/integration.sh "${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}" "${{ matrix.variant }}"

      # Publish the tested image. This rebuild comes entirely from the cache
      # the build above just filled (same builder, base images pinned by
      # digest) and adds the provenance and SBOM attestations.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: .
          target: ${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: |
            type=gha,scope=${{ env.CACHE_SCOPE }}-standard
            type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.variant }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # Make sure what went out is what was tested: the layers of the pushed
      # image must match those of the local one.
      - name: Verify the pushed image is the tested one
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}
        run: |
          set -euo pipefail
          layers() { docker image inspect --format '{{json .RootFS.Layers}}' "$1"; }
          tested=$(layers "$IMAGE")
          for repo in "${{ env.DOCKERHUB_IMAGE }}" "ghcr.io/${{ github.repository_owner }}/frankenpress"; do
            docker pull -q --platform "${{ matrix.platform }}" "$repo:$ARCH_TAG" >/dev/null
            if [ "$(layers "$repo:$ARCH_TAG")" != "$tested" ]; then
              echo "::error::$repo:$ARCH_TAG differs from the tested image"; exit 1
            fi
          done
          echo "Pushed layers match the tested image"

      # Report-only: lists HIGH/CRITICAL vulnerabilities in the job summary and
      # never fails the build. Trivy runs from its official image pinned by
      # digest rather than via aquasecurity/trivy-action, whose tags were
      # hijacked in 2026 (CVE-2026-33634).
      - name: Vulnerability scan (Trivy)
        if: matrix.platform == 'linux/amd64'
        continue-on-error: true
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ env.ARCH_TAG }}
          TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --format json --output /out/trivy.json "$IMAGE"
          docker run --rm -v "$PWD:/out" "$TRIVY" \
            convert --quiet --format sarif --output /out/trivy.sarif /out/trivy.json
          summary=$(jq -r '[.Results[]?.Vulnerabilities[]?] as $v
            | "critical=\($v | map(select(.Severity == "CRITICAL")) | length)"
            + " high=\($v | map(select(.Severity == "HIGH")) | length)"
            + " fixable=\($v | map(select((.FixedVersion // "") != "")) | length)"' trivy.json)
          echo "::notice title=Trivy ($ARCH_TAG)::$summary"
          {
            echo "### Trivy: \`$IMAGE\`"
            echo "$summary"
            echo
            echo "| Severity | Vulnerability | Package | Installed | Fixed in |"
            echo "|---|---|---|---|---|"
            jq -r '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + .PkgName)
              | sort_by(if .Severity == "CRITICAL" then 0 else 1 end, .PkgName)[]
              | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "") |"' trivy.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Track the same findings in the repository's Security tab (code
      # scanning), one category per variant. Report-only like the scan; PRs
      # from forks can't upload, so failures don't fail the build.
      - name: Upload Trivy results to code scanning
        if: matrix.platform == 'linux/amd64'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.variant }}

  create-manifests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        php-version: ['8.5']
        variant: [standard, vips-ffi, weasyprint]
    env:
      # Tag suffix shared by both registries, e.g. "trixie" or "vips-ffi-trixie"
      SUFFIX: ${{ matrix.variant != 'standard' && format('{0}-', matrix.variant) || '' }}trixie
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Besides the floating tags, publish version-specific ones so deployments
      # can pin a build and roll back, e.g. php-8.5-trixie-wp7.1.2 (follows
      # rebuilds of that WordPress version) and php-8.5-trixie-wp7.1.2-20261004-0112
      # (one specific build; the UTC time keeps several builds on one day apart).
      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          tag="php-${{ matrix.php-version }}-$SUFFIX"
          wp=$(docker run --rm --entrypoint php "${{ env.DOCKERHUB_IMAGE }}:$tag-amd64" \
            -r 'include "/usr/src/wordpress/wp-includes/version.php"; echo $wp_version;')
          [[ "$wp" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Unexpected WordPress version '$wp'"; exit 1; }
          build_date=$(date -u +%Y%m%d-%H%M)
          echo "::notice title=Tags ($tag)::WordPress $wp, build $build_date"
          for repo in "${{ env.DOCKERHUB_IMAGE }}" "ghcr.io/${{ github.repository_owner }}/frankenpress"; do
            tags=(-t "$repo:$tag" -t "$repo:$tag-wp$wp" -t "$repo:$tag-wp$wp-$build_date")
            if [ "${{ matrix.php-version }}" = "$LATEST_PHP" ]; then
              # standard: trixie + latest; vips-ffi: vips-ffi-trixie + vips-ffi (same for weasyprint)
              tags+=(-t "$repo:$SUFFIX" -t "$repo:${{ matrix.variant == 'standard' && 'latest' || matrix.variant }}")
            fi
            docker buildx imagetools create "${tags[@]}" "$repo:$tag-amd64" "$repo:$tag-arm64"
            docker buildx imagetools inspect "$repo:$tag"
          done

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, which silently stops the weekly rebuilds that pick up PHP and
  # base image fixes (this is what froze notglossy/frankenpress-src).
  # Re-enabling the workflow through the API resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/docker-trixie.yml/enable"
