name: Build Docker Images (Trixie)

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - 'php.ini'
      - 'imagemagick-policy.xml'
      - 'frankenpress-entrypoint.sh'
      - 'frankenpress-prepend.php'
      - 'frankenpress-sendmail.sh'
      - 'frankenpress-bundled.sh'
      - 'frankenpress-mariadb.sh'
      - 'frankenpress-cron.sh'
      - 'frankenpress-cron.php'
      - 'wp-cli.yml'
      - 'weasyprint/requirements.txt'
      - '.dockerignore'
      - 'tests/**'
      - '.github/workflows/docker-trixie.yml'
  # Every pull request builds and tests, without a paths filter: main
  # requires these checks, and a PR that never reports them (e.g. one that
  # only touches the README) could never be merged. Pushes to main keep the
  # filter, so documentation changes don't republish images.
  pull_request:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 1 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # GHCR is the primary registry: the build jobs push the per-architecture
  # images there only. create-manifests copies the finished multi-arch tags
  # to Docker Hub, so Docker Hub sees uploads but almost no reads, which keeps
  # the bock account clear of its pull rate limit (200 per 6 hours).
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/frankenpress
  DOCKERHUB_IMAGE: bock/frankenpress
  # PHP version that receives the unversioned tags (latest, trixie, vips-ffi, ...).
  # Keep in sync with the php-version lists below and the php-build base image
  # tag in the Dockerfile (the PHP version is chosen there, not via build-args).
  LATEST_PHP: '8.5'

jobs:
  # One build timestamp for the whole run: the build jobs put it into the
  # image.version label and create-manifests into the dated tag, so both
  # match. Re-running failed jobs keeps it, so a retry doesn't publish a
  # second dated tag for the same build.
  build-date:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        run: echo "date=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: [build-date]
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        php-version: ['8.5']
        # Dockerfile targets; the tag suffix is derived from the variant name
        variant: [standard, vips-ffi, weasyprint]
        # Split platforms to use native runners (amd64 on x64, arm64 on ARM); PRs build amd64 only
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["linux/amd64"]') || fromJSON('["linux/amd64", "linux/arm64"]') }}
      fail-fast: false
    # Job-level permissions replace the workflow's, so repeat those and add
    # security-events for uploading Trivy results to code scanning
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # e.g. php-8.5-trixie-amd64 or php-8.5-vips-ffi-trixie-arm64
      ARCH_TAG: php-${{ matrix.php-version }}${{ matrix.variant != 'standard' && format('-{0}', matrix.variant) || '' }}-trixie-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      CACHE_SCOPE: ${{ matrix.platform }}-${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build jobs push to GHCR only (see GHCR_IMAGE above), so they don't
      # log in to Docker Hub: their pulls of public images (base images,
      # BuildKit, test containers) are anonymous and count against the runner,
      # not against the bock account. PR builds never push and skip the login;
      # secrets aren't available to PRs from forks anyway.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every run builds into the local Docker daemon first and tests that
      # image; the push further down only happens once the tests pass, so
      # scheduled rebuilds (new Debian packages) are tested like PRs.
      # Attestations need a registry push, so this build has none, and the
      # labels are only added by the push, once the versions are known.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: .
          target: ${{ matrix.variant }}
          load: true
          tags: ${{ env.GHCR_IMAGE }}:${{ env.ARCH_TAG }}
          # Each variant writes its own cache scope; the variants also read the standard
          # scope so the shared base layers are reused.
          cache-from: |
            type=gha,scope=${{ env.CACHE_SCOPE }}-standard
            type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}-${{ matrix.variant }}
          provenance: false

      # Versions come from the built image, not from the Dockerfile: the
      # FrankenPHP base tag floats across PHP patch releases. They feed the
      # security floor in the smoke test, the image labels and, through the
      # labels, the version-specific tags in create-manifests.
      - name: Read versions
        id: versions
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ env.ARCH_TAG }}
          # e.g. "trixie" or "vips-ffi-trixie", as in create-manifests
          SUFFIX: ${{ matrix.variant != 'standard' && format('{0}-', matrix.variant) || '' }}trixie
          BUILD_DATE: ${{ needs.build-date.outputs.date }}
        run: |
          set -euo pipefail
          run() { docker run --rm "$IMAGE" "$@"; }
          php=$(run php -r 'echo PHP_VERSION;')
          # e.g. "FrankenPHP v1.14.0 PHP 8.5.13 Caddy v2.11.9 h1:..."
          fp_out=$(run frankenphp version)
          frankenphp=$(sed -nE 's/^FrankenPHP v([0-9.]+) .*/\1/p' <<<"$fp_out")
          caddy=$(sed -nE 's/.* Caddy v([0-9.]+)( .*)?$/\1/p' <<<"$fp_out")
          wordpress=$(run php -r 'include "/usr/src/wordpress/wp-includes/version.php"; echo $wp_version;')
          # Fails closed: these end up in tag names
          [[ "$php" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$php" == "${{ matrix.php-version }}".* ]] \
            || { echo "::error::PHP '$php' is not a ${{ matrix.php-version }}.x release"; exit 1; }
          [[ "$frankenphp" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Unexpected FrankenPHP version '$frankenphp' in '$fp_out'"; exit 1; }
          [[ "$caddy" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Unexpected Caddy version '$caddy' in '$fp_out'"; exit 1; }
          [[ "$wordpress" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || { echo "::error::Unexpected WordPress version '$wordpress'"; exit 1; }
          {
            echo "php=$php"
            echo "frankenphp=$frankenphp"
            echo "caddy=$caddy"
            echo "wordpress=$wordpress"
            # The dated tag create-manifests publishes for this build, the
            # most specific one, e.g.
            # php-8.5.13-trixie-wp7.1.5-frankenphp1.14.0-caddy2.11.9-20261123-1311
            echo "tag=php-$php-$SUFFIX-wp$wordpress-frankenphp$frankenphp-caddy$caddy-$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Versions ($ARCH_TAG)::PHP $php, FrankenPHP $frankenphp, Caddy $caddy, WordPress $wordpress"

      - name: Smoke test
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ env.ARCH_TAG }}
          PHP: ${{ steps.versions.outputs.php }}
          FRANKENPHP: ${{ steps.versions.outputs.frankenphp }}
        run: |
          set -euo pipefail
          run() { docker run --rm "$IMAGE" "$@"; }

          # Startup must be clean: a broken extension loader only shows up as a warning
          out=$(run php -v 2>&1)
          echo "$out"
          grep -q "PHP ${{ matrix.php-version }}" <<<"$out"
          if grep -qiE 'warning|unable to load' <<<"$out"; then
            echo "::error::PHP startup produced warnings"; exit 1
          fi

          # Output is captured before matching: piping into "grep -q" lets grep
          # exit at the first match, and the writer's SIGPIPE then fails the
          # step under pipefail.
          modules=$(run php -m)
          grep -qx 'Zend OPcache' <<<"$modules"

          # Every extension from the Dockerfile's install-php-extensions list:
          # a dropped entry still starts cleanly, so the warning check misses it
          for ext in bcmath exif gd intl mysqli pdo_mysql zip imagick memcached apcu redis igbinary msgpack; do
            grep -qx "$ext" <<<"$modules" || { echo "::error::Missing PHP extension: $ext"; exit 1; }
          done

          # FFI is installed everywhere but only enabled in the vips-ffi image
          if [ "${{ matrix.variant }}" != vips-ffi ] && grep -qx FFI <<<"$modules"; then
            echo "::error::FFI is enabled outside the vips-ffi image"; exit 1
          fi

          # Security floor: the FrankenPHP advisories fixed in 1.13.4 and the
          # PHP security releases of 2026-11-19 (8.5.13; 8.5.12 already fixed
          # PHP2Shell, CVE-2026-109618/109619). The versions come from the
          # "Read versions" step, which fails when one can't be parsed. Raise
          # these after the next security release.
          at_least() { [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          at_least "$FRANKENPHP" 1.13.4 || { echo "::error::FrankenPHP '$FRANKENPHP' is older than 1.13.4"; exit 1; }
          at_least "$PHP" 8.5.13 || { echo "::error::PHP '$PHP' is older than 8.5.13"; exit 1; }

          run wp --version
          grep -qx wp-config-docker.php <<<"$(run ls /usr/src/wordpress)"

          if [ "${{ matrix.variant }}" = vips-ffi ]; then
            grep -qx FFI <<<"$modules"
            grep -q libvips <<<"$(run dpkg -l)"
            grep -qx vips-image-editor-ffi <<<"$(run ls /usr/src/wordpress/wp-content/plugins)"
            grep -qx 1 <<<"$(run printenv VIPS_BLOCK_UNTRUSTED)"
          fi

          # Security floor for WeasyPrint, as above: 70.0 fixes the CVEs of
          # Debian's 62.3 (see the Dockerfile)
          if [ "${{ matrix.variant }}" = weasyprint ]; then
            weasy_version=$(run weasyprint --version | sed -nE 's/^WeasyPrint version ([0-9.]+)$/\1/p')
            at_least "$weasy_version" 70.0 || { echo "::error::WeasyPrint '$weasy_version' is older than 70.0"; exit 1; }
          fi

      # Full run against WordPress + MariaDB: hardening rules, proxy handling,
      # healthcheck and image processing (see tests/integration.sh)
      - name: Integration test
        run: tests/integration.sh "${{ env.GHCR_IMAGE }}:${{ env.ARCH_TAG }}" "${{ matrix.variant }}"

      # Tags and labels for the push. Runs on PRs too, so the check below
      # catches label mistakes before they reach main. Labels only change the
      # image config, so the push still reuses every tested layer.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ env.ARCH_TAG }}
          # image.version would default to the per-architecture tag; set it to
          # the dated tag of this build instead. The frankenpress.* labels let
          # users check versions without pulling (see "Pinning a Version" in
          # the README); create-manifests derives its tags from them.
          labels: |
            org.opencontainers.image.title=FrankenPress${{ matrix.variant == 'vips-ffi' && ' VIPS/FFI' || matrix.variant == 'weasyprint' && ' WeasyPrint' || '' }} (PHP ${{ matrix.php-version }} Trixie)
            org.opencontainers.image.description=WordPress${{ matrix.variant == 'vips-ffi' && ' with VIPS and FFI' || matrix.variant == 'weasyprint' && ' with WeasyPrint for PDFs' || '' }} running on FrankenPHP with Debian Trixie
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.versions.outputs.tag }}
            frankenpress.php.version=${{ steps.versions.outputs.php }}
            frankenpress.frankenphp.version=${{ steps.versions.outputs.frankenphp }}
            frankenpress.caddy.version=${{ steps.versions.outputs.caddy }}
            frankenpress.wordpress.version=${{ steps.versions.outputs.wordpress }}
          flavor: |
            latest=false

      # metadata-action generates its own image.version; make sure ours
      # replaced it rather than being added next to it
      - name: Check labels
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail
          echo "$LABELS"
          versions=$(grep '^org.opencontainers.image.version=' <<<"$LABELS" || true)
          [ "$versions" = "org.opencontainers.image.version=$TAG" ] \
            || { echo "::error::Unexpected image.version labels: $versions"; exit 1; }
          [ "$(grep -c '^frankenpress\.' <<<"$LABELS")" = 4 ] \
            || { echo "::error::Version labels missing"; exit 1; }

      # Publish the tested image. This rebuild comes entirely from the cache
      # the build above just filled (same builder, base images pinned by
      # digest) and adds the provenance and SBOM attestations.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: .
          target: ${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: |
            type=gha,scope=${{ env.CACHE_SCOPE }}-standard
            type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.variant }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # Make sure what went out is what was tested: the layers of the pushed
      # image must match those of the local one. create-manifests copies this
      # image to Docker Hub unchanged.
      - name: Verify the pushed image is the tested one
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ env.ARCH_TAG }}
        run: |
          set -euo pipefail
          layers() { docker image inspect --format '{{json .RootFS.Layers}}' "$1"; }
          tested=$(layers "$IMAGE")
          docker pull -q --platform "${{ matrix.platform }}" "$IMAGE" >/dev/null
          if [ "$(layers "$IMAGE")" != "$tested" ]; then
            echo "::error::$IMAGE differs from the tested image"; exit 1
          fi
          echo "Pushed layers match the tested image"

      # Report-only: lists HIGH/CRITICAL vulnerabilities in the job summary and
      # never fails the build. Trivy runs from its official image pinned by
      # digest rather than via aquasecurity/trivy-action, whose tags were
      # hijacked in 2026 (CVE-2026-33634).
      - name: Vulnerability scan (Trivy)
        if: matrix.platform == 'linux/amd64'
        continue-on-error: true
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ env.ARCH_TAG }}
          TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          set -euo pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --format json --output /out/trivy.json "$IMAGE"
          docker run --rm -v "$PWD:/out" "$TRIVY" \
            convert --quiet --format sarif --output /out/trivy.sarif /out/trivy.json
          summary=$(jq -r '[.Results[]?.Vulnerabilities[]?] as $v
            | "critical=\($v | map(select(.Severity == "CRITICAL")) | length)"
            + " high=\($v | map(select(.Severity == "HIGH")) | length)"
            + " fixable=\($v | map(select((.FixedVersion // "") != "")) | length)"' trivy.json)
          echo "::notice title=Trivy ($ARCH_TAG)::$summary"
          {
            echo "### Trivy: \`$IMAGE\`"
            echo "$summary"
            echo
            echo "| Severity | Vulnerability | Package | Installed | Fixed in |"
            echo "|---|---|---|---|---|"
            jq -r '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + .PkgName)
              | sort_by(if .Severity == "CRITICAL" then 0 else 1 end, .PkgName)[]
              | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "") |"' trivy.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Track the same findings in the repository's Security tab (code
      # scanning), one category per variant. Report-only like the scan; PRs
      # from forks can't upload, so failures don't fail the build.
      - name: Upload Trivy results to code scanning
        if: matrix.platform == 'linux/amd64'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.variant }}

  create-manifests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-date, build]
    strategy:
      matrix:
        php-version: ['8.5']
        variant: [standard, vips-ffi, weasyprint]
    env:
      # Tag suffix shared by both registries, e.g. "trixie" or "vips-ffi-trixie"
      SUFFIX: ${{ matrix.variant != 'standard' && format('{0}-', matrix.variant) || '' }}trixie
      BUILD_DATE: ${{ needs.build-date.outputs.date }}
    # imagetools needs no builder, so there's no setup-buildx step: the
    # runner's buildx is enough, and it would pull BuildKit from Docker Hub.
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Besides the floating tags, publish version-specific ones so deployments
      # can pin a build and roll back:
      # - php-8.5-trixie-wp7.1.2: follows rebuilds of that WordPress version
      # - php-8.5.13-trixie and php-8.5.13-trixie-wp7.1.2: the same for one PHP
      #   patch release (issue #54)
      # - php-8.5.13-trixie-wp7.1.2-frankenphp1.14.0-caddy2.11.9-20261123-1311:
      #   one specific build (the UTC time keeps several builds on one day
      #   apart). Earlier builds used php-8.5-trixie-wp7.1.2-<date> instead.
      # The tags are created on GHCR from the per-architecture images there,
      # then that exact image is copied to Docker Hub; both must end up with
      # the same digest. Docker Hub is only written to, apart from one digest
      # check per variant.
      # The versions come from the labels the build job set, read from GHCR
      # without pulling. The build timestamp comes from the
      # build-date job, so the dated tag matches the image.version label, and
      # both architectures must carry that label: it encodes every version,
      # so this also proves they agree.
      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          tag="php-${{ matrix.php-version }}-$SUFFIX"
          label() { docker buildx imagetools inspect "$GHCR_IMAGE:$tag-$1" --format "{{index .Image.Config.Labels \"$2\"}}"; }
          php=$(label amd64 frankenpress.php.version)
          fp=$(label amd64 frankenpress.frankenphp.version)
          caddy=$(label amd64 frankenpress.caddy.version)
          wp=$(label amd64 frankenpress.wordpress.version)
          [[ "$php" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected PHP version '$php'"; exit 1; }
          [[ "$fp" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected FrankenPHP version '$fp'"; exit 1; }
          [[ "$caddy" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected Caddy version '$caddy'"; exit 1; }
          [[ "$wp" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Unexpected WordPress version '$wp'"; exit 1; }
          [[ "$BUILD_DATE" =~ ^[0-9]{8}-[0-9]{4}$ ]] || { echo "::error::Unexpected build date '$BUILD_DATE'"; exit 1; }
          dated="php-$php-$SUFFIX-wp$wp-frankenphp$fp-caddy$caddy-$BUILD_DATE"
          for arch in amd64 arm64; do
            [ "$(label $arch org.opencontainers.image.version)" = "$dated" ] \
              || { echo "::error::The $arch image's image.version label isn't $dated"; exit 1; }
          done
          echo "::notice title=Tags ($tag)::$dated"
          names=("$tag" "$tag-wp$wp" "$dated" "php-$php-$SUFFIX" "php-$php-$SUFFIX-wp$wp")
          if [ "${{ matrix.php-version }}" = "$LATEST_PHP" ]; then
            # standard: trixie + latest; vips-ffi: vips-ffi-trixie + vips-ffi (same for weasyprint)
            names+=("$SUFFIX" "${{ matrix.variant == 'standard' && 'latest' || matrix.variant }}")
          fi
          ghcr_tags=(); hub_tags=()
          for n in "${names[@]}"; do
            ghcr_tags+=(-t "$GHCR_IMAGE:$n"); hub_tags+=(-t "$DOCKERHUB_IMAGE:$n")
          done
          docker buildx imagetools create "${ghcr_tags[@]}" "$GHCR_IMAGE:$tag-amd64" "$GHCR_IMAGE:$tag-arm64"
          docker buildx imagetools inspect "$GHCR_IMAGE:$dated"
          # Copy the finished multi-arch image, attestations included: the
          # layers come from GHCR, Docker Hub only receives them
          docker buildx imagetools create "${hub_tags[@]}" "$GHCR_IMAGE:$dated"
          digest() { docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'; }
          ghcr_digest=$(digest "$GHCR_IMAGE:$dated")
          hub_digest=$(digest "$DOCKERHUB_IMAGE:$dated")
          [ "$ghcr_digest" = "$hub_digest" ] \
            || { echo "::error::Docker Hub has $hub_digest, GHCR $ghcr_digest"; exit 1; }
          echo "Published $ghcr_digest to GHCR and Docker Hub"

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, which silently stops the weekly rebuilds that pick up PHP and
  # base image fixes (this is what froze notglossy/frankenpress-src).
  # Re-enabling the workflow through the API resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/docker-trixie.yml/enable"
